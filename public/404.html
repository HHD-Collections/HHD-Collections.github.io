<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HHD Collections - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;

      var l = window.location;
      // If deployed under a subpath like /hhd-collections/, count segments:
      // Typically 1 if under user.github.io/repo-name
      // To auto-detect:
      var repoSegment = l.pathname.split('/')[1];
      if (repoSegment && !repoSegment.includes('.')) {
        pathSegmentsToKeep = 1;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
